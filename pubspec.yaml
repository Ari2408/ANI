name: purb_chetana
description: "Purb Chetana - AI Elderly Cognitive & Memory Assistance Platform for North Eastern Region & Tamil Nadu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  flutter_tts: ^4.2.0
  speech_to_text: ^7.4.0
  fl_chart: ^0.68.0
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  video_player: ^2.9.1
  record: ^5.2.0
  file_picker: ^8.0.0
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.6
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  flutter_webrtc: ^0.12.5
  qr_flutter: ^4.1.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_platform_interface: ^1.3.0
  record_linux: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/camera_icon.png
    - assets/images/app_logo.png
    - assets/images/kaziranga.jpg
    - assets/images/living_root_bridge.jpg
    - assets/images/bihu_dance.jpg

  fonts:
    - family: Comic Relief
      fonts:
        - asset: assets/fonts/ComicRelief.ttf
    - family: Noto Serif Tamil
      fonts:
        - asset: assets/fonts/NotoSerifTamil.ttf
    - family: Vijaya
      fonts:
        - asset: assets/fonts/Vijaya.ttf
